<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alışveriş Sepetim - Yağmur Bilgisayar</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        .quantity-input { text-align: center; border-radius: 5px; -moz-appearance: textfield; }
        .quantity-input::-webkit-inner-spin-button, .quantity-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .payment-option {
            background-color: #FBBF24;
            color: #1E3A8A;
            border: 2px solid transparent;
            transition: all 0.3s ease-in-out;
            cursor: pointer;
        }
        .payment-option:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .payment-option.selected {
            background-color: #DC2626;
            color: #FFFFFF !important;
            border-color: #1E3A8A;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .payment-option.selected label {
             color: #FFFFFF !important;
        }
    </style>
</head>
<body class="bg-gray-100">

    <header class="bg-blue-900 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Alışveriş Sepetim</h1>
            <a href="index.php" class="bg-green-400 text-blue-900 font-bold px-4 py-2 rounded-lg shadow-md hover:bg-yellow-500 transition-transform transform hover:scale-105 flex items-center gap-2">
                <i class="fas fa-arrow-left"></i>
                <span>Alışverişe Devam Et</span>
            </a>
        </div>
    </header>

    <main id="cart-container" class="container mx-auto p-4 md:p-6">
        <div class="text-center py-20">
            <i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i>
            <p class="mt-4 text-lg text-gray-600">Sepetiniz yükleniyor...</p>
        </div>
    </main>

    <script src="cart.js"></script>
    
    <div id="notification-container" class="fixed top-5 right-5 z-[99999] w-full max-w-sm space-y-3">
    </div>
</body>
</html>
